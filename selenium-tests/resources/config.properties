# ─────────────────────────────────────────────
#  Configuración general de pruebas Selenium
#  Huellitas Callejeras - Frontend
# ─────────────────────────────────────────────

[app]
# URL base del frontend (sobreescribible con la variable de entorno BASE_URL)
base_url = http://localhost:3000

[browser]
# Navegador a utilizar: chrome | firefox
name     = chrome
# Ejecutar en modo headless (sin interfaz gráfica): true | false
headless = false

[driver]
# Espera implícita en segundos
implicit_wait = 10
# Espera explícita por defecto en segundos
explicit_wait = 15

[testdata]
# Ruta relativa al archivo de datos de prueba (desde la raíz de selenium-tests/)
path = resources/testdata/test_data.json
